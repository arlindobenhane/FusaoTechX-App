// FusãoTechX Mz • Módulo da aplicação
plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.fusaotech.studio'
    compileSdk 34

    signingConfigs {
        release {
            storeFile file('/tmp/fusaotech-release.jks')
            storePassword 'fusaotech2024'
            keyAlias 'fusaotech'
            keyPassword 'fusaotech2024'
        }
    }

    defaultConfig {
        applicationId "com.fusaotech.studio"
        minSdk 26
        targetSdk 34
        versionCode 11
        versionName "3.0"
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    // A app não usa AndroidX: só a biblioteca padrão do Android + Kotlin.
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.22"
    implementation "com.google.zxing:core:3.5.3"
}
