<!doctype html>
<html lang="pt"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>FusãoTechX</title>
<style>
:root{--bg:#070a12;--p:rgba(255,255,255,.04);--p2:rgba(255,255,255,.07);--l:rgba(255,255,255,.1);--tx:#eef2ff;--mu:#94a3c4;--ac:#22d3ee;--ac2:#818cf8;--ok:#34d399;--er:#fb7185;--grad:linear-gradient(135deg,#22d3ee,#818cf8 60%,#c084fc)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:radial-gradient(900px 500px at 90% -10%,rgba(129,140,248,.14),transparent),var(--bg);color:var(--tx);font:14.5px/1.45 system-ui,Segoe UI,Roboto,sans-serif;overflow:hidden;height:100vh}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,textarea{font:inherit;color:var(--tx);background:rgba(0,0,0,.3);border:1px solid var(--l);border-radius:12px;padding:11px 13px;outline:none;width:100%}
svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#login{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:50;padding:24px}
#login .b{width:100%;max-width:340px;text-align:center}
#login h1{color:var(--ac);margin:0 0 4px;font-size:30px}#login p{color:var(--mu);margin:0 0 22px}
#login input{text-align:center;font-size:30px;letter-spacing:.3em;margin-bottom:16px}
.pbtn{background:var(--grad);color:#06121f;font-weight:700;border-radius:12px;padding:13px;width:100%}
.app{display:none;grid-template-rows:auto 1fr auto;height:100vh}
.app.on{display:grid}
header{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--l)}
header .m{width:34px;height:34px;border-radius:10px;background:var(--grad);display:grid;place-items:center;font-weight:900;color:#06121f}
header b{font-size:15px}header .s{font-size:12px;color:var(--mu)}
.stat{margin-left:auto;display:flex;gap:14px;font-size:12px;color:var(--mu);text-align:right}
.stat b{display:block;color:var(--tx);font-size:14px}
main{overflow:auto;padding:16px}
.view{display:none}.view.on{display:block;animation:f .2s}@keyframes f{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
nav{display:flex;gap:4px;padding:8px;border-top:1px solid var(--l);background:rgba(7,10,18,.8);overflow-x:auto}
nav button{flex:1;min-width:64px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;border-radius:12px;color:var(--mu);font-size:11px;font-weight:600}
nav button.on{color:var(--ac);background:var(--p2)}
.live{display:flex;flex-direction:column;align-items:center;gap:14px}
.phone{position:relative;border-radius:26px;padding:8px;background:linear-gradient(160deg,#1f2937,#0b1020);box-shadow:0 20px 60px rgba(0,0,0,.5);max-width:min(100%,420px)}
.phone img{display:block;width:100%;border-radius:20px;background:#000;touch-action:none;-webkit-user-drag:none}
.ctl{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%;max-width:460px}
.ctl button{display:flex;flex-direction:column;align-items:center;gap:5px;padding:12px 4px;border-radius:12px;background:var(--p2);border:1px solid var(--l);font-size:11px;color:var(--mu);font-weight:600}
.ctl button:active{transform:scale(.94)}
.card{background:var(--p);border:1px solid var(--l);border-radius:16px;padding:16px;margin-bottom:14px}
.card h3{margin:0 0 12px;font-size:14px;display:flex;align-items:center;gap:9px;color:var(--ac)}
.row{display:flex;gap:10px;align-items:center}.row>*{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px;border-radius:12px;background:var(--p2);border:1px solid var(--l);font-weight:600}
.btn.p{background:var(--grad);color:#06121f;border:0}.btn.ok{background:rgba(52,211,153,.15);color:#a7f3d0;border-color:rgba(52,211,153,.3)}.btn.er{background:rgba(251,113,133,.14);color:#fecdd3;border-color:rgba(251,113,133,.3)}
.btn.sm{padding:8px 11px;font-size:13px}
.it{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;background:var(--p);border:1px solid var(--l);margin-bottom:8px}
.it .av{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-weight:800;color:#06121f;flex:none}
.it .tx{flex:1;min-width:0;text-align:left}.it .tx b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.it .tx span{font-size:12px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.dial{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.dial button{padding:16px;border-radius:14px;background:var(--p2);border:1px solid var(--l);font-size:20px;font-weight:600}
.msg{padding:10px 12px;border-radius:12px;margin-bottom:8px;max-width:85%}
.msg.in{background:var(--p2)}.msg.out{background:rgba(34,211,238,.14);margin-left:auto}
.chip{display:inline-flex;gap:6px;align-items:center;padding:6px 12px;border-radius:99px;background:var(--p2);border:1px solid var(--l);font-size:12px;font-weight:600;color:var(--mu)}
.chip.on{color:var(--ac);border-color:var(--ac)}
#toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%) translateY(20px);background:#0e7490;color:#fff;padding:11px 18px;border-radius:99px;font-weight:600;opacity:0;transition:.25s;z-index:60;pointer-events:none}
#toast.on{opacity:1;transform:translateX(-50%)}
.empty{text-align:center;color:var(--mu);padding:40px 10px}
footer{text-align:center;font-size:11px;color:var(--mu);padding:6px}
</style></head>
<body>
<div id="login"><div class="b"><h1>FusãoTechX</h1><p>Controlo do telefone</p>
<input id="pin" type="tel" inputmode="numeric" maxlength="12" placeholder="código"><button class="pbtn" onclick="entrar()">Entrar</button>
<p style="margin-top:28px;font-size:12px">FusãoTechX Mz · fusaotech.com</p></div></div>

<div class="app" id="app">
<header>
  <div class="m">FX</div><div><b id="hNome">Telefone</b><div class="s" id="hSub">Android</div></div>
  <div class="stat"><div><b id="sBat">—</b>bateria</div><div><b id="sArm">—</b>livre</div></div>
</header>
<main>
  <section class="view on" id="v-ecra"><div class="live">
    <div class="phone"><img id="scr" alt=""></div>
    <div class="row" style="max-width:460px"><span class="chip" data-q="40">Rápido</span><span class="chip on" data-q="60">Normal</span><span class="chip" data-q="80">Nítido</span></div>
    <div class="ctl">
      <button data-g="back"><svg><path d="M15 6l-6 6 6 6"/></svg>Voltar</button>
      <button data-g="home"><svg><circle cx="12" cy="12" r="7"/></svg>Início</button>
      <button data-g="recents"><svg><rect x="6" y="6" width="12" height="12" rx="2"/></svg>Recentes</button>
      <button data-g="notifications"><svg><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"/></svg>Barra</button>
      <button data-k="voldown"><svg><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 12h3"/></svg>Vol −</button>
      <button data-k="volup"><svg><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 12h3M18.5 10.5v3"/></svg>Vol +</button>
      <button data-g="power"><svg><path d="M12 3v9M6 7a8 8 0 1 0 12 0"/></svg>Energia</button>
      <button data-g="lock"><svg><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>Bloquear</button>
    </div>
    <div class="card" style="width:100%;max-width:460px"><h3>Escrever no telefone</h3>
      <textarea id="kb" rows="2" placeholder="Toque num campo no telefone e escreva aqui…"></textarea>
      <div class="row" style="margin-top:8px"><button class="btn p sm" onclick="escrever()">Enviar</button><button class="btn sm" onclick="post('/backspace')">Apagar</button><button class="btn sm" onclick="post('/global',{a:'back'})">OK/Enter fecha</button></div>
    </div>
  </div></section>

  <section class="view" id="v-sms">
    <div class="card"><h3>Enviar mensagem</h3>
      <input id="smsNum" placeholder="Número (+258…)" inputmode="tel">
      <textarea id="smsTxt" rows="3" placeholder="Mensagem…" style="margin-top:8px"></textarea>
      <div class="row" style="margin-top:8px"><button class="btn p" onclick="enviarSms()">Enviar SMS</button><button class="btn ok" onclick="enviarWa()">WhatsApp</button></div>
    </div>
    <div class="card"><h3>Recebidas <button class="btn sm" style="margin-left:auto" onclick="carregarSms()">↻</button></h3><div id="smsList" class="empty">Toque em ↻</div></div>
  </section>

  <section class="view" id="v-call">
    <div class="card"><input id="num" style="font-size:24px;text-align:center" placeholder="+258 …" inputmode="tel">
      <div class="dial" id="dial"></div>
      <div class="row"><button class="btn ok" onclick="ligar()">Ligar</button><button class="btn er" onclick="post('/endcall')">Terminar</button></div>
    </div>
    <div class="card"><h3>Contactos <button class="btn sm" style="margin-left:auto" onclick="carregarContactos()">↻</button></h3><div id="contList" class="empty">Toque em ↻</div></div>
  </section>

  <section class="view" id="v-notif">
    <div class="row" style="margin-bottom:12px"><button class="btn sm" onclick="carregarNotifs()">↻ Atualizar</button><button class="btn sm er" onclick="post('/notifdismiss',{key:''}).then(carregarNotifs)">Limpar todas</button></div>
    <div id="notifList" class="empty">Toque em ↻</div>
  </section>

  <section class="view" id="v-apps">
    <input id="aBusca" placeholder="Procurar app…" oninput="pintarApps()" style="margin-bottom:12px">
    <div id="appList" class="empty">A carregar…</div>
  </section>

  <section class="view" id="v-files">
    <div class="row" style="margin-bottom:12px"><button class="btn sm" onclick="subir()">⬆</button><div id="crumb" style="flex:3;font-size:13px;color:var(--mu);align-self:center;overflow:hidden">Armazenamento</div><label class="btn sm">Enviar<input type="file" id="up" hidden multiple></label></div>
    <div id="fileList" class="empty">A carregar…</div>
  </section>
</main>
<nav id="nav">
  <button data-v="ecra" class="on"><svg><rect x="6" y="2" width="12" height="20" rx="3"/></svg>Ecrã</button>
  <button data-v="sms"><svg><path d="M4 5h16v11H8l-4 4z"/></svg>SMS</button>
  <button data-v="call"><svg><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg>Chamar</button>
  <button data-v="notif"><svg><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"/></svg>Notif.</button>
  <button data-v="apps"><svg><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>Apps</button>
  <button data-v="files"><svg><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>Ficheiros</button>
</nav>
</div>
<div id="toast"></div>

<script>
const $=s=>document.querySelector(s);let CODE=localStorage.getItem('ftxcode')||'';let W=1080,H=2340;
const CORES=['#22d3ee','#818cf8','#c084fc','#f472b6','#34d399','#fbbf24'];
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._);t._=setTimeout(()=>t.classList.remove('on'),2200)}
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function fmtB(b){if(!b)return '—';if(b>=1073741824)return (b/1073741824).toFixed(1)+' GB';if(b>=1048576)return (b/1048576).toFixed(0)+' MB';if(b>=1024)return (b/1024).toFixed(0)+' KB';return b+' B'}
async function get(u){const r=await fetch(u+(u.includes('?')?'&':'?')+'k='+CODE);if(r.status===401){sair();throw 0}return r.json()}
async function post(u,b){const r=await fetch(u+'?k='+CODE,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b||{})});if(r.status===401){sair();throw 0}return r.json().catch(()=>({}))}
function sair(){localStorage.removeItem('ftxcode');$('#app').classList.remove('on');$('#login').style.display='grid'}

async function entrar(){const c=$('#pin').value.trim();const r=await fetch('/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:c})}).then(x=>x.json()).catch(()=>({}));
 if(r.ok){CODE=c;localStorage.setItem('ftxcode',c);arrancar()}else toast('Código errado')}
$('#pin').addEventListener('keyup',e=>{if(e.key==='Enter')entrar()});

function arrancar(){$('#login').style.display='none';$('#app').classList.add('on');$('#scr').src='/stream?k='+CODE+'&t='+Date.now();estado();setInterval(estado,5000);montarDial();ligarEcra()}
async function estado(){try{const s=await get('/state');W=s.w||W;H=s.h||H;$('#hNome').textContent=s.nome||'Telefone';$('#hSub').textContent=(s.marca||'')+' · Android '+(s.android||'');$('#sBat').textContent=(s.bateria||0)+'%'+(s.carregar?' ⚡':'');$('#sArm').textContent=fmtB(s.livre)}catch(e){}}

// navegação
$('#nav').onclick=e=>{const b=e.target.closest('button');if(!b)return;document.querySelectorAll('nav button,.view').forEach(x=>x.classList.remove('on'));b.classList.add('on');$('#v-'+b.dataset.v).classList.add('on');
 if(b.dataset.v==='apps')carregarApps();if(b.dataset.v==='notif')carregarNotifs();if(b.dataset.v==='files')abrir('');if(b.dataset.v==='sms')carregarSms();if(b.dataset.v==='call')carregarContactos()};

// ecrã ao vivo
const scr=$('#scr');let pd=null;
function pt(e){const r=scr.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height,t:performance.now()}}
scr.addEventListener('pointerdown',e=>{pd=pt(e);scr.setPointerCapture(e.pointerId)});
scr.addEventListener('pointerup',e=>{if(!pd)return;const p=pt(e),dt=p.t-pd.t,d=Math.hypot(p.x-pd.x,p.y-pd.y);
 if(d<.02){dt>480?post('/longpress',{x:pd.x,y:pd.y}):post('/tap',{x:pd.x,y:pd.y})}else post('/swipe',{x1:pd.x,y1:pd.y,x2:p.x,y2:p.y,ms:Math.max(80,Math.min(900,dt))});pd=null});
function ligarEcra(){$('#scr').onerror=()=>{setTimeout(()=>{$('#scr').src='/stream?k='+CODE+'&t='+Date.now()},1500)}}
document.querySelectorAll('[data-q]').forEach(c=>c.onclick=()=>{document.querySelectorAll('[data-q]').forEach(x=>x.classList.remove('on'));c.classList.add('on');post('/quality',{q:+c.dataset.q})});
$('#nav').addEventListener('click',()=>{},true);
document.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>post('/global',{a:b.dataset.g}));
document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>toast(b.dataset.k==='volup'?'Volume +':'Volume −')||post('/global',{a:b.dataset.k==='volup'?'quicksettings':'quicksettings'}));
function escrever(){const t=$('#kb').value;if(!t)return;post('/text',{t}).then(r=>{if(!r.ok)toast('Toque primeiro num campo no telefone');else $('#kb').value=''})}

// SMS
async function carregarSms(){$('#smsList').innerHTML='A carregar…';try{const r=await get('/sms');const l=r.lista||[];$('#smsList').innerHTML=l.length?l.map(m=>`<div class="msg ${m.enviada?'out':'in'}"><div style="font-size:12px;color:var(--mu)">${esc(m.de)}</div>${esc(m.texto)}</div>`).join(''):'<div class="empty">Sem mensagens</div>'}catch(e){}}
function enviarSms(){const num=$('#smsNum').value,t=$('#smsTxt').value;if(!num||!t)return toast('Número e texto');post('/sendsms',{num,texto:t}).then(r=>{toast(r.ok?'SMS enviado ✓':'Falhou (permissão SMS?)');if(r.ok)$('#smsTxt').value=''})}
function enviarWa(){const num=$('#smsNum').value,t=$('#smsTxt').value;if(!num)return toast('Número');post('/whatsapp',{num,texto:t});toast('WhatsApp aberto')}

// chamadas
function montarDial(){$('#dial').innerHTML=['1','2','3','4','5','6','7','8','9','+','0','⌫'].map(k=>`<button>${k}</button>`).join('');
 $('#dial').onclick=e=>{const b=e.target.closest('button');if(!b)return;const n=$('#num');n.value=b.textContent==='⌫'?n.value.slice(0,-1):n.value+b.textContent}}
function ligar(){const num=$('#num').value;if(!num)return toast('Número');post('/call',{num});toast('A ligar…')}
async function carregarContactos(){$('#contList').innerHTML='A carregar…';try{const r=await get('/contactos');const l=r.lista||[];$('#contList').innerHTML=l.length?l.slice(0,300).map(c=>`<div class="it" onclick="$('#num').value='${esc(c.num)}';toast('Número escolhido')"><div class="av" style="background:${CORES[c.nome.length%6]}">${esc((c.nome[0]||'?').toUpperCase())}</div><div class="tx"><b>${esc(c.nome)}</b><span>${esc(c.num)}</span></div></div>`).join(''):'<div class="empty">Sem contactos (deu permissão?)</div>'}catch(e){}}

// notificações
async function carregarNotifs(){$('#notifList').innerHTML='A carregar…';try{const r=await get('/notifs');const l=r.lista||[];if(!r.ativo){$('#notifList').innerHTML='<div class="empty">Ative "ler notificações" na app do telefone.</div>';return}
 $('#notifList').innerHTML=l.length?l.map(n=>`<div class="it"><div class="av" style="background:${CORES[(n.app||'').length%6]}">${esc((n.app[0]||'?').toUpperCase())}</div><div class="tx"><b>${esc(n.titulo||n.app)}</b><span>${esc(n.texto)}</span></div><button class="btn sm er" onclick="post('/notifdismiss',{key:'${esc(n.key)}'}).then(carregarNotifs)">✕</button></div>`).join(''):'<div class="empty">Sem notificações</div>'}catch(e){}}

// apps
let APPS=[];async function carregarApps(){if(APPS.length){pintarApps();return}$('#appList').innerHTML='A carregar…';try{const r=await get('/apps');APPS=(r.lista||[]).sort((a,b)=>a.nome.localeCompare(b.nome));pintarApps()}catch(e){}}
function pintarApps(){const f=($('#aBusca').value||'').toLowerCase();const l=APPS.filter(a=>!f||a.nome.toLowerCase().includes(f)||a.pkg.includes(f));
 $('#appList').innerHTML=l.map(a=>`<div class="it"><div class="av" style="background:${CORES[a.pkg.length%6]}">${esc((a.nome[0]||'?').toUpperCase())}</div><div class="tx"><b>${esc(a.nome)}</b><span>${esc(a.pkg)}</span></div><button class="btn sm p" onclick="post('/applaunch',{pkg:'${esc(a.pkg)}'})">Abrir</button></div>`).join('')||'<div class="empty">Nada</div>'}

// ficheiros
let DIR='';async function abrir(p){DIR=p;$('#fileList').innerHTML='A abrir…';try{const r=await get('/files?p='+encodeURIComponent(p||''));DIR=r.dir;$('#crumb').textContent=r.dir.replace('/storage/emulated/0','Armazenamento').replace('/sdcard','Armazenamento');
 const it=r.itens||[];$('#fileList').innerHTML=it.map(i=>i.d?`<div class="it" onclick="abrir('${esc(i.p)}')"><div class="av" style="background:#22d3ee22;color:#22d3ee"><svg><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></div><div class="tx"><b>${esc(i.n)}</b><span>Pasta</span></div></div>`:`<div class="it"><div class="av" style="background:#818cf822;color:#818cf8">${esc((i.e||'?').toUpperCase().slice(0,3))}</div><div class="tx"><b>${esc(i.n)}</b><span>${fmtB(i.s)}</span></div><a class="btn sm" href="/file?baixar=1&k=${CODE}&p=${encodeURIComponent(i.p)}">⬇</a></div>`).join('')||'<div class="empty">Pasta vazia</div>'}catch(e){}}
function subir(){if(DIR&&DIR!=='/storage/emulated/0'&&DIR!=='/sdcard')abrir(DIR.substring(0,DIR.lastIndexOf('/'))||'')}
$('#up').onchange=async e=>{for(const f of e.target.files){await fetch('/upload?k='+CODE+'&nome='+encodeURIComponent(f.name),{method:'POST',body:f});toast('Enviado: '+f.name)}e.target.value='';abrir(DIR)};

// teclado físico (quando se usa no PC)
document.addEventListener('keydown',e=>{if(!$('#app').classList.contains('on'))return;if(document.activeElement&&['INPUT','TEXTAREA'].includes(document.activeElement.tagName))return;
 if(e.key.length===1){post('/text',{t:e.key})}else if(e.key==='Backspace'){post('/backspace')}else if(e.key==='Enter'){post('/global',{a:'back'})}});

if(CODE)arrancar();
</script>
</body></html>
